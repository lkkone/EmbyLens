name: embylens
services:
  home-embylens:
    container_name: home-embylens
    image: ${EMBYLENS_IMAGE:-embylens:0.1.0-arm64}
    ports:
      - "18792:8080"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: "true"
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      SECURITY_CODE: ${SECURITY_CODE:?Set SECURITY_CODE}
    volumes:
      - ./data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
