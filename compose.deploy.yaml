services:
  embylens:
    image: ${EMBYLENS_IMAGE:-embylens:0.1.0-amd64}
    ports:
      - "127.0.0.1:${PORT:-18792}:8080"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SECURITY_CODE: ${SECURITY_CODE:?Set SECURITY_CODE}
      COOKIE_SECURE: "true"
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - embylens-data:/data
    networks:
      - caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  embylens-data:
networks:
  caddy:
    external: true
    name: caddy_default
