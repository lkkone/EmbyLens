services:
  embylens:
    build: .
    ports:
      - "127.0.0.1:18791:8080"
    environment:
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SECURITY_CODE: ${SECURITY_CODE:?Set SECURITY_CODE}
      COOKIE_SECURE: "false"
    volumes:
      - embylens-data:/data
    restart: unless-stopped
volumes:
  embylens-data:
